<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="920" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="550" y="52" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="0.5">UltimateResume Pipeline Architecture</text>
  <text x="550" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">AI-powered resume generation with human-in-the-loop optimization</text>

  <!-- Legend -->
  <g transform="translate(80, 870)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#inputGrad)"/>
    <text x="22" y="13" fill="#cbd5e1" font-size="12">User Input</text>
    <rect x="140" y="0" width="16" height="16" rx="3" fill="url(#aiGrad)"/>
    <text x="162" y="13" fill="#cbd5e1" font-size="12">AI Processing</text>
    <rect x="310" y="0" width="16" height="16" rx="3" fill="url(#vectorGrad)"/>
    <text x="332" y="13" fill="#cbd5e1" font-size="12">Vector + AI</text>
    <rect x="470" y="0" width="16" height="16" rx="3" fill="url(#humanGrad)"/>
    <text x="492" y="13" fill="#cbd5e1" font-size="12">Human-in-the-Loop</text>
    <rect x="670" y="0" width="16" height="16" rx="3" fill="url(#outputGrad)"/>
    <text x="692" y="13" fill="#cbd5e1" font-size="12">Output</text>
  </g>

  <!-- ==================== STEP 1: Ingest ==================== -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="300" height="90" rx="12" fill="#1e293b" stroke="url(#inputGrad)" stroke-width="2"/>
    <rect width="300" height="4" rx="2" fill="url(#inputGrad)" y="0"/>
    <text x="20" y="30" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1">STEP 1</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="16" font-weight="600">Ingest Activity Bank</text>
    <text x="20" y="72" fill="#94a3b8" font-size="12">Parse CSV / JSON / PDF / DOCX files</text>
  </g>

  <!-- ==================== STEP 2: Template ==================== -->
  <g transform="translate(400, 110)" filter="url(#shadow)">
    <rect width="300" height="90" rx="12" fill="#1e293b" stroke="url(#inputGrad)" stroke-width="2"/>
    <rect width="300" height="4" rx="2" fill="url(#inputGrad)" y="0"/>
    <text x="20" y="30" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1">STEP 2</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="16" font-weight="600">Upload Resume Template</text>
    <text x="20" y="72" fill="#94a3b8" font-size="12">Contact info + section structure</text>
  </g>

  <!-- ==================== STEP 3: Job Description ==================== -->
  <g transform="translate(740, 110)" filter="url(#shadow)">
    <rect width="300" height="90" rx="12" fill="#1e293b" stroke="url(#inputGrad)" stroke-width="2"/>
    <rect width="300" height="4" rx="2" fill="url(#inputGrad)" y="0"/>
    <text x="20" y="30" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1">STEP 3</text>
    <text x="20" y="52" fill="#f1f5f9" font-size="16" font-weight="600">Upload Job Description</text>
    <text x="20" y="72" fill="#94a3b8" font-size="12">Target job posting text</text>
  </g>

  <!-- Connector: Steps 1,2,3 down to Step 4 -->
  <line x1="210" y1="200" x2="210" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="550" y1="200" x2="550" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="890" y1="200" x2="890" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="210" y1="225" x2="890" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="550" y1="225" x2="550" y2="250" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,256 544,246 556,246" fill="#475569"/>

  <!-- ==================== STEP 4: AI Analysis ==================== -->
  <g transform="translate(170, 258)" filter="url(#shadow)">
    <rect width="760" height="108" rx="12" fill="#1e293b" stroke="url(#aiGrad)" stroke-width="2"/>
    <rect width="760" height="4" rx="2" fill="url(#aiGrad)" y="0"/>
    <text x="24" y="32" fill="#a78bfa" font-size="11" font-weight="600" letter-spacing="1">STEP 4 — AI ANALYSIS</text>
    <text x="24" y="56" fill="#f1f5f9" font-size="16" font-weight="600">Generate Dual Rubrics</text>
    <!-- ATS Rubric box -->
    <rect x="24" y="68" width="340" height="28" rx="6" fill="#2d1b69" opacity="0.6"/>
    <text x="40" y="87" fill="#c4b5fd" font-size="12">ATS Rubric — 8-15 keyword groups by skill category</text>
    <!-- Intent Rubric box -->
    <rect x="384" y="68" width="352" height="28" rx="6" fill="#2d1b69" opacity="0.6"/>
    <text x="400" y="87" fill="#c4b5fd" font-size="12">Intent Rubric — 10-20 items by hiring psychology</text>
    <!-- Model badges -->
    <rect x="620" y="18" width="120" height="22" rx="11" fill="#7c3aed" opacity="0.3"/>
    <text x="640" y="33" fill="#c4b5fd" font-size="10" font-weight="600">Gemini 2.5 Flash</text>
  </g>

  <!-- Connector: Step 4 to Step 5 -->
  <line x1="550" y1="366" x2="550" y2="400" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,406 544,396 556,396" fill="#475569"/>

  <!-- ==================== STEP 5: Vector Matching ==================== -->
  <g transform="translate(170, 408)" filter="url(#shadow)">
    <rect width="760" height="120" rx="12" fill="#1e293b" stroke="url(#vectorGrad)" stroke-width="2"/>
    <rect width="760" height="4" rx="2" fill="url(#vectorGrad)" y="0"/>
    <text x="24" y="32" fill="#f472b6" font-size="11" font-weight="600" letter-spacing="1">STEP 5 — VECTOR MATCHING</text>
    <text x="24" y="56" fill="#f1f5f9" font-size="16" font-weight="600">Hybrid Similarity Search</text>

    <!-- Three scoring components -->
    <rect x="24" y="68" width="220" height="40" rx="8" fill="#4c1d3d" opacity="0.5"/>
    <text x="40" y="84" fill="#fda4af" font-size="11" font-weight="600">Semantic (55%)</text>
    <text x="40" y="100" fill="#94a3b8" font-size="10">Gemini embeddings</text>

    <rect x="264" y="68" width="220" height="40" rx="8" fill="#4c1d3d" opacity="0.5"/>
    <text x="280" y="84" fill="#fda4af" font-size="11" font-weight="600">Keyword (30%)</text>
    <text x="280" y="100" fill="#94a3b8" font-size="10">Exact phrase matching</text>

    <rect x="504" y="68" width="232" height="40" rx="8" fill="#4c1d3d" opacity="0.5"/>
    <text x="520" y="84" fill="#fda4af" font-size="11" font-weight="600">Context (15%)</text>
    <text x="520" y="100" fill="#94a3b8" font-size="10">Domain relevance bonus</text>
  </g>

  <!-- Connector: Step 5 to Step 6 -->
  <line x1="550" y1="528" x2="550" y2="555" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,561 544,551 556,551" fill="#475569"/>

  <!-- ==================== STEP 6: Human Review ==================== -->
  <g transform="translate(170, 563)" filter="url(#shadow)">
    <rect width="760" height="90" rx="12" fill="#1e293b" stroke="url(#humanGrad)" stroke-width="2"/>
    <rect width="760" height="4" rx="2" fill="url(#humanGrad)" y="0"/>
    <text x="24" y="30" fill="#fbbf24" font-size="11" font-weight="600" letter-spacing="1">STEP 6 — HUMAN-IN-THE-LOOP</text>
    <text x="24" y="54" fill="#f1f5f9" font-size="16" font-weight="600">Match Review + Statement Generation</text>
    <text x="24" y="74" fill="#94a3b8" font-size="12">Review top-K matches per rubric item, select best activities, generate S-T-I bullets (8-thread parallel)</text>
    <!-- Badge -->
    <rect x="600" y="14" width="140" height="22" rx="11" fill="#92400e" opacity="0.4"/>
    <text x="616" y="29" fill="#fcd34d" font-size="10" font-weight="600">You decide what fits</text>
  </g>

  <!-- Connector: Step 6 to Step 7 -->
  <line x1="550" y1="653" x2="550" y2="680" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,686 544,676 556,676" fill="#475569"/>

  <!-- ==================== STEP 7: Assembly ==================== -->
  <g transform="translate(60, 688)" filter="url(#shadow)">
    <rect width="470" height="90" rx="12" fill="#1e293b" stroke="url(#aiGrad)" stroke-width="2"/>
    <rect width="470" height="4" rx="2" fill="url(#aiGrad)" y="0"/>
    <text x="24" y="30" fill="#a78bfa" font-size="11" font-weight="600" letter-spacing="1">STEP 7 — AI ASSEMBLY</text>
    <text x="24" y="54" fill="#f1f5f9" font-size="16" font-weight="600">ATS Resume Assembly</text>
    <text x="24" y="74" fill="#94a3b8" font-size="12">Structure resume from template + generated bullets</text>
    <rect x="340" y="14" width="110" height="22" rx="11" fill="#7c3aed" opacity="0.3"/>
    <text x="356" y="29" fill="#c4b5fd" font-size="10" font-weight="600">Gemini 2.5 Pro</text>
  </g>

  <!-- ==================== STEP 8: Intent Rewrite ==================== -->
  <g transform="translate(570, 688)" filter="url(#shadow)">
    <rect width="470" height="90" rx="12" fill="#1e293b" stroke="url(#humanGrad)" stroke-width="2"/>
    <rect width="470" height="4" rx="2" fill="url(#humanGrad)" y="0"/>
    <text x="24" y="30" fill="#fbbf24" font-size="11" font-weight="600" letter-spacing="1">STEP 8 — HUMAN-IN-THE-LOOP</text>
    <text x="24" y="54" fill="#f1f5f9" font-size="16" font-weight="600">Intent Rewrite</text>
    <text x="24" y="74" fill="#94a3b8" font-size="12">Align narrative to hiring manager psychology</text>
    <rect x="330" y="14" width="120" height="22" rx="11" fill="#92400e" opacity="0.4"/>
    <text x="346" y="29" fill="#fcd34d" font-size="10" font-weight="600">You guide the tone</text>
  </g>

  <!-- Connector: Steps 7,8 down to Step 9 -->
  <line x1="295" y1="778" x2="295" y2="800" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="805" y1="778" x2="805" y2="800" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="295" y1="800" x2="805" y2="800" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="550" y1="800" x2="550" y2="820" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="550,826 544,816 556,816" fill="#475569"/>

  <!-- ==================== STEP 9: Export ==================== -->
  <g transform="translate(350, 828)" filter="url(#shadow)">
    <rect width="400" height="36" rx="18" fill="url(#outputGrad)" opacity="0.9"/>
    <text x="200" y="23" text-anchor="middle" fill="#022c22" font-size="14" font-weight="700">STEP 9 — Export Optimized Resume (LaTeX / PDF)</text>
  </g>
</svg>
